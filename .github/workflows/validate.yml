name: Validate public directory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Updates the public featured story from the approved library each morning.
  # Scheduling is best-effort on GitHub's runners, not guaranteed exact time.
  schedule:
    - cron: '17 8 * * *'
      timezone: 'America/Chicago'

permissions:
  contents: read

concurrency:
  group: public-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Catalog & syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JSON data and official URLs
        run: python3 scripts/validate_catalog.py
      - name: Validate browser JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/guide.js
          node --check assets/story.js
          node --check assets/lesson.js
          node --check assets/theme.js
          node --check lab/demo.js
      - name: Validate static human/AI discovery endpoints
        run: python3 scripts/validate_discovery.py
      - name: Check public-site generator and smoke test syntax
        run: python3 -m py_compile scripts/smoke_pages.py scripts/render_daily_spotlight.py scripts/generate_lessons.py
      - name: Ensure no patient-facing data folder is committed
        run: |
          test ! -d patients
          test ! -d clinical-records
      - name: Test daily feature selection and evidence gates
        run: python3 -m unittest discover -s scripts -p "test_daily_spotlight.py"
      - name: Require source-located editorial reviews for newly approved stories
        run: python3 scripts/review_gate.py
      - name: Test review signoff, claim audits and clinical expert requirements
        run: python3 -m unittest discover -s scripts -p "test_review_gate.py"
      - name: Verify interactive discovery lesson generator
        run: python3 -m unittest discover -s scripts -p "test_generate_lessons.py"
      - name: Build only approved public files and check internal links
        run: python3 scripts/prepare_pages.py
      # Only upload the approved artifact after EVERY check above has passed.
      # GitHub Pages Actions publishing was verified active on 2026-11-06.
      # Pull requests validate code but never upload production artifacts.
      - name: Upload approved GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy approved site
    # Explicit release switch; currently enabled (as verified by the
    # successful 2026-11-06 deploy). If false or missing, fail closed.
    if: github.event_name != 'pull_request' && vars.PAGES_ACTIONS_READY == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check out source for public-site comparison
        uses: actions/checkout@v4
      - name: Check the published HTTPS release against source
        # Keep nonblocking during initial rollout to observe any Pages
        # propagation/cache behavior before promoting to a required check.
        continue-on-error: true
        run: python3 scripts/smoke_pages.py "${{ steps.deployment.outputs.page_url }}"
